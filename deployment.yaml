apiVersion: apps/v1
kind: Deployment
metadata:
  name: week2-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week2-app
  template:
    metadata:
      labels:
        app: week2-app
    spec:
      containers:
      - name: week2-app
        image: week2-test-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: week2-app-service
spec:
  type: NodePort
  selector:
    app: week2-app
  ports:
    - port: 80
      targetPort: 80
